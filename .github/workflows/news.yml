name: Post News to Telegram

on:
  schedule:
    - cron: '0 * * * *'  # Каждый час
  workflow_dispatch:  # Для ручного запуска

permissions:
  contents: write  # Разрешаем сохранять файл памяти

jobs:
  post-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python news_bot.py

      - name: Save memory to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add posted_news.json
          git commit -m "Update posted news memory" || echo "No changes to commit"
          git push
